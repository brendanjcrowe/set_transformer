# Pretraining: pn
# Autoencoder recipe; arch must match what the RL extractor builds.
# GENERATED by experiments/benchmark/generate_configs.py -- do not edit by
# hand; edit the registry or train.py and regenerate.

encoder_family: pn
autoencoder_class: PointNetAE
architecture:
  dim_hidden: 128
bottleneck:
  num_encodings: 8
  dim_encoder: 2
  stat_dim: 16
optimization:
  num_epochs: 60
  batch_size: 64
  learning_rate: 0.001
  reconstruction_loss: sinkhorn
  sinkhorn_blur: 0.05
  model_selection: best exact val EMD (independent of the training loss)
alignment_arm:
  enabled_by: --align
  objective: "reconstruction + lambda * (1 - Pearson(latent dists, EMD dists))"
  lambda: 0.2
  metric: cosine
  warmup_epochs: 15
  ramp_epochs: 15
  requires: pairwise EMD matrix from pretrain/2_precompute_emd.py
  hazard: model selection is by val EMD and blind to alignment; if the best epoch precedes the end of the lambda ramp the checkpoint is not actually aligned. The trainer warns and records best_epoch / selected_val_r
produces: "pretrained/<env>/pn_{plain,align}/checkpoint_best.pt"
