# PPO
# Read from a live model built by train.py::build_model.
# GENERATED by experiments/benchmark/generate_configs.py -- do not edit by
# hand; edit the registry or train.py and regenerate.

algorithm: PPO
library: stable-baselines3 2.6.0
policy_class: MultiInputActorCriticPolicy
set_by_train_py:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_envs: 4
  gamma: "per-env (envs/<env>.yaml)"
  policy_kwargs: features_extractor_class/kwargs ONLY -- every head setting below is an SB3 default
rollout_and_update:
  n_steps_per_env: 2048
  rollout_size: 8192
  minibatch_size: 64
  minibatches_per_epoch: 128
  n_epochs: 10
  gradient_steps_per_rollout: 1280
objective:
  clip_range: 0.2
  clip_range_vf: null
  gae_lambda: 0.95
  normalize_advantage: true
  ent_coef: 0
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null
  learning_rate_schedule: constant
optimizer:
  class: Adam
  eps: 1e-05
  weight_decay: 0
  betas: [0.9, 0.999]
architecture:
  share_features_extractor: true
  extractor_copies: 1
  net_arch:
    pi: [64, 64]
    vf: [64, 64]
  activation_fn: Tanh
  ortho_init: true
  squash_output: false
  use_sde: false
  heads:
    continuous:
      reference_env: msearch
      action_space: Box(-1.0, 1.0, (2,), float32)
      action_distribution: DiagGaussianDistribution
      policy_mlp: ["Linear 128->64", Tanh, "Linear 64->64", Tanh]
      value_mlp: ["Linear 128->64", Tanh, "Linear 64->64", Tanh]
      action_net: ["Linear 64->2"]
      value_net: ["Linear 64->1"]
      params:
        policy_mlp: 12416
        value_mlp: 12416
        action_net: 130
        value_net: 65
        log_std: 2
        heads_total_excl_extractor: 25029
      log_std:
        type: state-independent nn.Parameter
        init: 0
        size: 2
    discrete:
      reference_env: odd_even
      action_space: Discrete(10)
      action_distribution: CategoricalDistribution
      policy_mlp: ["Linear 128->64", Tanh, "Linear 64->64", Tanh]
      value_mlp: ["Linear 128->64", Tanh, "Linear 64->64", Tanh]
      action_net: ["Linear 64->10"]
      value_net: ["Linear 64->1"]
      params:
        policy_mlp: 12416
        value_mlp: 12416
        action_net: 650
        value_net: 65
        heads_total_excl_extractor: 25547
  note: "the actor and critic MLPs read the SAME extractor output; the extractor (method-specific, see methods/*.yaml) is counted once"
comparability_with_other_algorithm:
  head_widths_differ: "PPO uses [64, 64] Tanh; SAC uses [256, 256] ReLU"
  actor_hidden_params:
    ppo: 12416
    sac: 98816
    ratio: 8
  trainable_extractor_copies:
    ppo: 1
    sac: 2
  implication: a SAC-vs-PPO difference is also a head-capacity and encoder-copy difference; it is not a pure algorithm effect unless net_arch is pinned to match
