# SAC
# Read from a live model built by train.py::build_model.
# GENERATED by experiments/benchmark/generate_configs.py -- do not edit by
# hand; edit the registry or train.py and regenerate.

algorithm: SAC
library: stable-baselines3 2.6.0
policy_class: MultiInputPolicy
requires: continuous (Box) action space -- odd_even is Discrete, PPO only
set_by_train_py:
  learning_rate: 0.0003
  batch_size: 64
  n_envs: 4
  gamma: "per-env (envs/<env>.yaml)"
  policy_kwargs: features_extractor_class/kwargs ONLY -- every head setting below is an SB3 default
  deviation_from_sb3_default:
    batch_size: 64 (SB3 SAC default is 256)
replay:
  buffer_class: DictReplayBuffer
  buffer_size: 1000000
  learning_starts: 100
  optimize_memory_usage: false
  note: buffer_size exceeds the total step budget of every registered env, so nothing is ever evicted -- effectively full-history replay
update:
  train_freq: 1 step
  gradient_steps: 1
  n_envs: 4
  update_to_data_ratio: 0.25
  note: one gradient step per vectorized step, which collects 4 transitions -- UTD 1/4, below the canonical SAC ratio of 1
  tau: 0.005
  target_update_interval: 1
entropy:
  ent_coef: auto
  auto_tuned: true
  initial_log_ent_coef: 0
  target_entropy: -2
  target_entropy_rule: -dim(action_space)
optimizer:
  actor: Adam
  critic: Adam
  entropy_coef: Adam
  eps: 1e-08
  betas: [0.9, 0.999]
  learning_rate_schedule: constant, shared by all three optimizers
architecture:
  share_features_extractor: false
  extractor_copies:
    actor: 1
    critic: 1
    critic_target: 1
    trainable: 2
    note: the actor and critic each own an INDEPENDENT extractor, so a learned encoder is trained twice with different gradients; the target critic holds a Polyak-averaged copy. For frozen arms all copies load the same checkpoint and stay fixed
  net_arch: [256, 256]
  activation_fn: ReLU
  n_critics: 2
  use_sde: false
  actor:
    action_distribution: SquashedDiagGaussianDistribution
    latent_pi: ["Linear 128->256", ReLU, "Linear 256->256", ReLU]
    mu: ["Linear 256->2"]
    log_std: ["Linear 256->2"]
    log_std_type: "state-dependent (a Linear head, clipped to [-20, 2])"
    params:
      latent_pi: 98816
      mu: 514
      log_std: 514
      heads_total_excl_extractor: 99844
  critic:
    q_network_input: extractor features ++ action
    q_network: ["Linear 130->256", ReLU, "Linear 256->256", ReLU, "Linear 256->1"]
    params:
      per_q_network: 99585
      all_q_networks: 199170
comparability_with_other_algorithm:
  head_widths_differ: "PPO uses [64, 64] Tanh; SAC uses [256, 256] ReLU"
  actor_hidden_params:
    ppo: 12416
    sac: 98816
    ratio: 8
  trainable_extractor_copies:
    ppo: 1
    sac: 2
  implication: a SAC-vs-PPO difference is also a head-capacity and encoder-copy difference; it is not a pure algorithm effect unless net_arch is pinned to match
